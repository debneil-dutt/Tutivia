<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Students - Tutivia</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Tutivia</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="find-students.html">Find Students</a></li>
                <li><a href="solve-doubts.html">Solve Doubts</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem;">
        <h2>Find Students</h2>
        <div class="search-filter">
            <div class="search-filter-grid">
                <input type="text" id="searchSchool" placeholder="Search by school...">
                <select id="filterBoard">
                    <option value="">All Boards</option>
                    <option value="CBSE">CBSE</option>
                    <option value="State Board">State Board</option>
                    <option value="ICSE">ICSE</option>
                    <option value="IB">IB</option>
                </select>
                <button class="btn btn-primary" onclick="searchStudents()">Search</button>
            </div>
        </div>
        <div id="studentsList" class="cards-container"></div>
    </div>

    <script src="assets/script.js"></script>
    <script>
        async function searchStudents() {
            const school = document.getElementById('searchSchool').value;
            const board = document.getElementById('filterBoard').value;

            let url = `${API_URL}/students`;
            const params = new URLSearchParams();
            if (school) params.append('school', school);
            if (board) params.append('board', board);

            if (params.toString()) url += '?' + params.toString();

            try {
                const response = await fetch(url);
                const data = await response.json();

                const studentsList = document.getElementById('studentsList');
                studentsList.innerHTML = '';

                if (data.students.length === 0) {
                    studentsList.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No students found</p>';
                    return;
                }

                data.students.forEach(student => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${student.name}</h3>
                        <p><strong>School:</strong> ${student.school || 'N/A'}</p>
                        <p><strong>Board:</strong> ${student.board || 'N/A'}</p>
                        <div class="card-meta">
                            <span>${student.email}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-primary btn-small" onclick="contactStudent(${student.id}, '${student.name}')">Contact</button>
                        </div>
                    `;
                    studentsList.appendChild(card);
                });
            } catch (error) {
                showAlert('Error fetching students', 'error');
                console.error(error);
            }
        }

        function contactStudent(studentId, studentName) {
            sendMessage(studentId, studentName);
        }

        searchStudents();
    </script>
    
</body>
</html>
