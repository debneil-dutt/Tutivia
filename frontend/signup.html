<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tutivia</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Tutivia</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>
 
    <div class="form-container">
        <h2 id="formTitle">Sign Up as Student</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="school">School/College</label>
                <input type="text" id="school" placeholder="Optional">
            </div>
                <!-- Removed from general, handled separately for student and teacher -->

            <!-- Student specific -->
            <div id="studentFields">
                <div class="form-group">
                    <label for="studentBoard">Board</label>
                    <select id="studentBoard">
                        <option value="">Select Board</option>
                        <option value="CBSE">CBSE</option>
                        <option value="State Board">State Board</option>
                        <option value="ICSE">ICSE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject">Subjects Needed Help In</label>
                    <div class="checkbox-group" id="studentSubjectsGroup">
                        <label><input type="checkbox" name="subject" value="Mathematics"> Mathematics</label>
                        <label><input type="checkbox" name="subject" value="Physics"> Physics</label>
                        <label><input type="checkbox" name="subject" value="Chemistry"> Chemistry</label>
                        <label><input type="checkbox" name="subject" value="Biology"> Biology</label>
                        <label><input type="checkbox" name="subject" value="History"> History</label>
                        <label><input type="checkbox" name="subject" value="Geography"> Geography</label>
                        <label><input type="checkbox" name="subject" value="English"> English</label>
                        <label><input type="checkbox" name="subject" value="Bengali"> Bengali</label>
                        <label><input type="checkbox" name="subject" value="Hindi"> Hindi</label>
                    </div>
                </div>
            </div>

            <!-- Teacher specific -->
            <div id="teacherFields" style="display:none;">
                <div class="form-group">
                    <label for="expertise">Subject Expertise</label>
                    <div class="checkbox-group" id="teacherSubjectsGroup">
                        <label><input type="checkbox" name="expertise" value="Mathematics"> Mathematics</label>
                        <label><input type="checkbox" name="expertise" value="Physics"> Physics</label>
                        <label><input type="checkbox" name="expertise" value="Chemistry"> Chemistry</label>
                        <label><input type="checkbox" name="expertise" value="Biology"> Biology</label>
                        <label><input type="checkbox" name="expertise" value="History"> History</label>
                        <label><input type="checkbox" name="expertise" value="Geography"> Geography</label>
                        <label><input type="checkbox" name="expertise" value="English"> English</label>
                        <label><input type="checkbox" name="expertise" value="Bengali"> Bengali</label>
                        <label><input type="checkbox" name="expertise" value="Hindi"> Hindi</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="teacherBoard">Board Expertise</label>
                    <div class="checkbox-group" id="teacherBoardGroup">
                        <label><input type="checkbox" name="board" value="CBSE"> CBSE</label>
                        <label><input type="checkbox" name="board" value="State Board"> State Board</label>
                        <label><input type="checkbox" name="board" value="ICSE"> ICSE</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="experience">Years of Experience</label>
                    <input type="number" id="experience" placeholder="e.g., 5" min="0">
                </div>

                <div class="form-group">
                    <label for="bio">About You</label>
                    <textarea id="bio" placeholder="Tell students about your teaching style and qualifications"></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <p style="margin-top: 1rem; text-align: center;">
            Already have an account? <a href="login.html" style="color: #667eea;">Login here</a>
        </p>
    </div>

    <script src="assets/script.js"></script>
    <script>
        let userType = new URLSearchParams(window.location.search).get('type') || 'student';

        function toggleFields() {
            const studentFields = document.getElementById('studentFields');
            const teacherFields = document.getElementById('teacherFields');
            const title = document.getElementById('formTitle');

            if (userType === 'teacher') {
                studentFields.style.display = 'none';
                teacherFields.style.display = 'block';
                title.textContent = 'Sign Up as Teacher';
            } else {
                studentFields.style.display = 'block';
                teacherFields.style.display = 'none';
                title.textContent = 'Sign Up as Student';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const school = document.getElementById('school').value;

            let payload = {
                name,
                email,
                password,
                userType,
                school: school || null
            };

            if (userType === 'student') {
                const board = document.getElementById('studentBoard').value;
                if (!board) {
                    showAlert('Please select a Board', 'error');
                    return;
                }
                const selectedSubjects = Array.from(document.querySelectorAll('#studentSubjectsGroup input[type="checkbox"]:checked')).map(cb => cb.value);
                if (selectedSubjects.length === 0) {
                    showAlert('Please select at least 1 subject you need help in', 'error');
                    return;
                }
                payload.subject = selectedSubjects.join(', ');
                payload.board = board;
            } else {
                const selectedExpertise = Array.from(document.querySelectorAll('#teacherSubjectsGroup input[type="checkbox"]:checked')).map(cb => cb.value);
                const selectedBoards = Array.from(document.querySelectorAll('#teacherBoardGroup input[type="checkbox"]:checked')).map(cb => cb.value);
                
                if (selectedExpertise.length === 0) {
                    showAlert('Please select at least 1 subject expertise', 'error');
                    return;
                }

                if (selectedBoards.length === 0) {
                    showAlert('Please select at least 1 board', 'error');
                    return;
                }

                payload.subject = selectedExpertise.join(', ');
                payload.board = selectedBoards.join(', ');
                payload.experience = parseInt(document.getElementById('experience').value) || null;
                payload.bio = document.getElementById('bio').value || null;
            }

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify({
                        id: data.userId,
                        name: name,
                        email: email,
                        userType: userType,
                        subject: payload.subject,
                        board: payload.board,
                        school: payload.school,
                        experience: payload.experience,
                        bio: payload.bio
                    }));
                    showAlert('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    showAlert(data.error || 'Signup failed', 'error');
                }
            } catch (error) {
                showAlert('Error connecting to server', 'error');
                console.error(error);
            }
        });

        toggleFields();
    </script>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Tutivia</h3>
                    <p>Connecting students and teachers for better learning</p>
                </div>
                <div class="footer-section">
                    <h4>Contact Us</h4>
                    <p><strong>Name:</strong> Debneil Dutt</p>
                    <p><strong>Email:</strong> <a href="mailto:debneildutt.contact@gmail.com">debneildutt.contact@gmail.com</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Tutivia. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
