<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Tutivia</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Tutivia</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav> 

    <div class="form-container" style="max-width: 600px;">
        <h2>My Profile</h2>
        <div id="profileContent"></div>
    </div>

    <script src="assets/script.js"></script>
    <script>
        function loadProfile() {
            const user = getCurrentUser();
            if (!user) {
                document.getElementById('profileContent').innerHTML = '<p>Please login to view your profile</p>';
                return;
            }

            const profileHTML = `
                <div style="background: white; padding: 2rem; border-radius: 8px;">
                    <h3>Current Profile Information</h3>
                    <div id="profileView">
                        <p><strong>Name:</strong> ${user.name}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Role:</strong> <span class="badge ${user.userType === 'teacher' ? 'teacher' : 'student'}">${user.userType.charAt(0).toUpperCase() + user.userType.slice(1)}</span></p>
                        ${user.subject ? `<p><strong>Subject/Expertise:</strong> ${user.subject}</p>` : ''}
                        ${user.experience ? `<p><strong>Experience:</strong> ${user.experience} years</p>` : ''}
                    </div>
                    <hr style="margin: 2rem 0;">
                    <h3>Edit Profile</h3>
                    <form id="editProfileForm" onsubmit="updateProfile(event)">
                        <div class="form-group">
                            <label for="editName">Name:</label>
                            <input type="text" id="editName" name="name" value="${user.name}" required>
                        </div>
                        <div class="form-group">
                            <label for="editEmail">Email:</label>
                            <input type="email" id="editEmail" name="email" value="${user.email}" required>
                        </div>
                        ${user.userType === 'teacher' ? `
                            <div class="form-group">
                                <label for="editSubject">Subject/Expertise:</label>
                                <input type="text" id="editSubject" name="subject" value="${user.subject || ''}">
                            </div>
                            <div class="form-group">
                                <label for="editExperience">Years of Experience:</label>
                                <input type="number" id="editExperience" name="experience" value="${user.experience || ''}">
                            </div>
                            <div class="form-group">
                                <label for="editBoard">Board:</label>
                                <input type="text" id="editBoard" name="board" value="${user.board || ''}">
                            </div>
                            <div class="form-group">
                                <label for="editBio">Bio:</label>
                                <textarea id="editBio" name="bio" rows="3">${user.bio || ''}</textarea>
                            </div>
                        ` : `
                            <div class="form-group">
                                <label for="editSchool">School:</label>
                                <input type="text" id="editSchool" name="school" value="${user.school || ''}">
                            </div>
                            <div class="form-group">
                                <label for="editBoard">Board:</label>
                                <input type="text" id="editBoard" name="board" value="${user.board || ''}">
                            </div>
                        `}
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            `;

            document.getElementById('profileContent').innerHTML = profileHTML;
        }

        loadProfile();
    </script>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Tutivia</h3>
                    <p>Connecting students and teachers for better learning</p>
                </div>
                <div class="footer-section">
                    <h4>Contact Us</h4>
                    <p><strong>Name:</strong> Debneil Dutt</p>
                    <p><strong>Email:</strong> <a href="mailto:debneildutt.contact@gmail.com">debneildutt.contact@gmail.com</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Tutivia. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
