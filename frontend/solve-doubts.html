<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Doubts - Tutivia</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Tutivia</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="find-students.html">Find Students</a></li>
                <li><a href="solve-doubts.html">Solve Doubts</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem;">
        <h2>Solve Student Doubts</h2>

        <div id="solutionFormContainer" class="form-container" style="display:none; margin: 2rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Provide Solution</h3>
                <button class="btn btn-secondary btn-small" onclick="toggleSolutionForm(null)">Close</button>
            </div>
            <form id="solutionForm">
                <div class="form-group">
                    <label for="solutionText">Your Solution</label>
                    <textarea id="solutionText" required placeholder="Explain your solution in detail..."></textarea>
                </div>
                <div class="form-group">
                    <label for="solutionImage">Attach Image (optional)</label>
                    <input type="file" id="solutionImage" accept="image/*">
                </div>
                <button type="submit" class="btn-submit">Submit Solution</button>
            </form>
        </div>

        <div id="doubtsList" class="cards-container" style="margin-top: 2rem;"></div>
    </div>

    <script src="assets/script.js"></script>
    <script>
        let currentSolvingDoubtId = null;

        function toggleSolutionForm(doubtId) {
            currentSolvingDoubtId = doubtId;
            const form = document.getElementById('solutionFormContainer');
            if (doubtId) {
                form.style.display = 'block';
                form.scrollIntoView({ behavior: 'smooth' });
            } else {
                form.style.display = 'none';
            }
        }

        async function loadDoubts() {
            const user = getCurrentUser();
            if (!user || user.userType !== 'teacher') {
                showAlert('Please login as a teacher', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/doubts`);
                const data = await response.json();

                const doubtsList = document.getElementById('doubtsList');
                doubtsList.innerHTML = '';

                if (data.doubts.length === 0) {
                    doubtsList.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No doubts available</p>';
                    return;
                }

                data.doubts.forEach(doubt => {
                    const statusBadge = doubt.solved ? 
                        '<span class="badge solved">Solved</span>' : 
                        '<span class="badge unsolved">Pending</span>';
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${doubt.title}</h3>
                        <p>${doubt.description || ''}</p>
                        <p><strong>Subject:</strong> ${doubt.subject || 'N/A'}</p>
                        ${doubt.image ? `<p><strong>Attachment:</strong> <a href="${API_URL}/uploads/${doubt.image}" target="_blank">View Image</a></p>` : ''}
                        <div class="card-meta">
                            <span>${formatDate(doubt.createdAt)}</span>
                            ${statusBadge}
                        </div>
                        <div class="card-actions">
                            ${!doubt.solved ? 
                                `<button class="btn btn-primary btn-small" onclick="toggleSolutionForm(${doubt.id})">Provide Solution</button>` : 
                                `<button class="btn btn-secondary btn-small" onclick="viewSolutions(${doubt.id})">View Solutions</button>`
                            }
                        </div>
                    `;
                    doubtsList.appendChild(card);
                });
            } catch (error) {
                showAlert('Error loading doubts', 'error');
                console.error(error);
            }
        }

        async function viewSolutions(doubtId) {
            try {
                const response = await fetch(`${API_URL}/solutions/${doubtId}`);
                const data = await response.json();

                if (data.solutions.length === 0) {
                    showAlert('No solutions available yet', 'info');
                    return;
                }

                let solutions = '<h3>Solutions:</h3>';
                data.solutions.forEach(solution => {
                    const ratingDisplay = solution.rating ? `<p><strong>Rating:</strong> ${solution.rating}/5</p>` : '';
                    const feedbackDisplay = solution.feedback ? `<p><strong>Feedback:</strong> ${solution.feedback}</p>` : '';

                    solutions += `
                        <div style="background: #f8f9fa; padding: 1rem; margin: 1rem 0; border-radius: 5px;">
                            <h4>Teacher: ${solution.teacherName}</h4>
                            <p>${solution.solutionText}</p>
                            ${solution.solutionImage ? `<p><a href="${API_URL}/uploads/${solution.solutionImage}" target="_blank">View Solution Image</a></p>` : ''}
                            ${ratingDisplay}
                            ${feedbackDisplay}
                        </div>
                    `;
                });

                // Displaying using alert for simplicity as in my-doubts.html
                // A better approach would be a modal, but sticking to existing pattern.
                const modalDiv = document.createElement('div');
                modalDiv.innerHTML = `
                    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; justify-content: center; align-items: center;">
                        <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
                            ${solutions}
                            <button class="btn btn-secondary" onclick="this.parentElement.parentElement.remove()" style="margin-top: 1rem;">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modalDiv);
            } catch (error) {
                showAlert('Error loading solutions', 'error');
            }
        }

        document.getElementById('solutionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentSolvingDoubtId) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            const user = getCurrentUser();
            if (!user) {
                showAlert('Please login first', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const formData = new FormData();
            formData.append('doubtId', currentSolvingDoubtId);
            formData.append('teacherId', user.id);
            formData.append('solutionText', document.getElementById('solutionText').value);
            
            const imageFile = document.getElementById('solutionImage').files[0];
            if (imageFile) {
                formData.append('solutionImage', imageFile);
            }

            try {
                const response = await fetch(`${API_URL}/solutions`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Solution submitted successfully!', 'success');
                    document.getElementById('solutionForm').reset();
                    toggleSolutionForm(null);
                    loadDoubts(); // Refresh doubts list to update status
                } else {
                    showAlert(data.error || 'Error submitting solution', 'error');
                }
            } catch (error) {
                showAlert('Error submitting solution', 'error');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Solution';
            }
        });

        loadDoubts();
    </script>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Tutivia</h3>
                    <p>Connecting students and teachers for better learning</p>
                </div>
                <div class="footer-section">
                    <h4>Contact Us</h4>
                    <p><strong>Name:</strong> Debneil Dutt</p>
                    <p><strong>Email:</strong> <a href="mailto:debneildutt.contact@gmail.com">debneildutt.contact@gmail.com</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Tutivia. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
